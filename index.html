<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      (function() {
        const LOG_SERVER = 'http://localhost:14792/log';
        function report(level, message, stack) {
          fetch(LOG_SERVER, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              level: level,
              message: message,
              stack: stack,
              url: window.location.href
            })
          }).catch(() => {}); // 静默失败，避免循环报错
        }

        // 拦截控制台错误
        const _error = console.error;
        console.error = function() {
          const args = Array.from(arguments);
          const msg = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
          report('error', msg, new Error().stack);
          _error.apply(console, arguments);
        };

        // 拦截未捕获异常
        window.onerror = function(msg, url, line, col, err) {
          report('error', `运行时错误: ${msg}`, err ? err.stack : `Line: ${line}, Col: ${col}`);
        };

        // 拦截 Promise 拒绝
        window.onunhandledrejection = function(event) {
          report('error', `未处理的 Promise 拒绝: ${event.reason}`, event.reason ? event.reason.stack : '');
        };

        console.log("%c[启动器]%c 浏览器日志同步已建立", "color: #fff; background: #8B4513; padding: 2px 4px; border-radius: 3px;", "color: #8B4513;");
      })();
    </script>
    <script src="coi-serviceworker.js"></script>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/logo.png">
    <link rel="apple-touch-icon" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#8B4513" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="异界食堂" />
    <meta name="description" content="LLM驱动的东方Project主题RPG游戏 - 经营你的居酒屋，与幻想乡的少女们互动" />

    <!-- Prevent iOS text size adjustment -->
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <title>东方异界食堂 | Touhou's Isekai Izakaya</title>
    <style>
      /* Prevent overscroll/bounce on iOS */
      html, body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      /* Safe area padding for notched devices */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
