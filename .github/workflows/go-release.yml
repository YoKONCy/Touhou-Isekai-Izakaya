name: Go Backend Release

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'go/**'
      - '.github/workflows/go-release.yml'
  workflow_dispatch: # 允许手动触发打包

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: go/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Build Linux Binary
        run: |
          cd go
          GOOS=linux GOARCH=amd64 go build -o ../relay-server-linux .

      - name: Build Windows Binary
        run: |
          cd go
          GOOS=windows GOARCH=amd64 go build -o ../relay-server-windows.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            relay-server-linux
            relay-server-windows.exe
          name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || 'Latest Relay Server Build' }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest-build' }}
          body: |
            ## 东方异世界居酒屋 - 联机中继服务器 (Go Backend)
            
            本版本由 GitHub Actions 自动编译生成。
            
            ### 包含产物：
            - `relay-server-linux`: Linux (amd64) 可执行文件，适用于云服务器部署。
            - `relay-server-windows.exe`: Windows (amd64) 可执行文件，适用于本地调试或 Windows 服务器。
            
            ### 更新说明 (Build: ${{ github.sha }}):
            - [${{ github.ref_name }}] 自动云打包构建
            - 修复了联机大厅房主显示为未知的问题
            - 修复了网络延迟不显示的问题
            - 优化了房间信息同步逻辑
            
            ### 部署建议：
            1. Linux 环境请确保赋予执行权限：`chmod +x relay-server-linux`
            2. 运行命令：`./relay-server-linux -addr :8080`
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
